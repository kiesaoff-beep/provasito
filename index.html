<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimostrazione Didattica - Geolocalizzazione Automatica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        #risultato {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Localizzazione Automatica</h2>
        <div id="risultato">Inizializzazione rilevamento posizione...</div>
    </div>

    <script>
        // LA MAGIA: Questo blocco dice al browser: "Appena la pagina è pronta, esegui la funzione"
        document.addEventListener("DOMContentLoaded", () => {
            trovaPosizione();
        });

        function trovaPosizione() {
            const risultato = document.getElementById("risultato");

            if (!navigator.geolocation) {
                risultato.innerHTML = "La geolocalizzazione non è supportata dal tuo browser.";
                return;
            }

            risultato.innerHTML = "Richiesta posizione in corso... Controlla il pop-up del browser.";

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    risultato.innerHTML = `Posizione trovata!<br>Latitudine: ${lat}<br>Longitudine: ${lon}<br><em>Invio automatico a Vercel...</em>`;

                    // Invio automatico a Vercel (assicurati che il nome '/api/ricevidati' sia uguale al tuo file)
                    fetch('/api/ricevidati', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ latitudine: lat, longitudine: lon })
                    })
                    .then(res => res.json())
                    .then(data => {
                        risultato.innerHTML += `<br><br><span style="color: green;">[Vercel]: ${data.messaggio}</span>`;
                    })
                    .catch(err => {
                        console.error("Errore:", err);
                        risultato.innerHTML += `<br><br><span style="color: red;">Errore nell'invio automatico.</span>`;
                    });
                },
                function(error) {
                    // Gestione errori invariata
                    if (error.code === error.PERMISSION_DENIED) {
                        risultato.innerHTML = "L'utente ha bloccato l'accesso alla posizione.";
                    } else {
                        risultato.innerHTML = "Impossibile recuperare la posizione automaticamente.";
                    }
                }
            );
        }
    </script>

</body>
</html>
